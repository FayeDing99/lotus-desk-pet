name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            build_args: ""
          - platform: macos-15-intel
            build_args: ""
          - platform: ubuntu-22.04
            build_args: ""
          - platform: windows-latest
            build_args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Verify release metadata and secrets
        run: npm run version:check && npm run security:check

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: ${{ matrix.build_args }}
          tagName: ${{ github.ref_name }}
          releaseName: DeskPet ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify macOS app signature
        if: startsWith(matrix.platform, 'macos-')
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/DeskPet.app
